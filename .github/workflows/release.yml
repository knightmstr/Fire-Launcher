name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ github.event.inputs.version }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          # Ensure tag starts with 'v'
          if [[ "$RAW_TAG" != v* ]]; then
            TAG_NAME="v${RAW_TAG}"
          else
            TAG_NAME="${RAW_TAG}"
          fi

          VERSION_NAME="${TAG_NAME#v}"

          # Derive monotonic versionCode from semver, kept in lockstep with UpdateVersions.kt:
          #   (MAJOR*10000 + MINOR*100 + PATCH) * 1000 + PRE
          # PRE = 999 for a stable release, or the pre-release number 1..998 for -beta.N / -rc.N /
          # -alpha.N, so a stable build always ranks above its own betas.
          if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))? ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            BASE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              PRE=$(( 10#${BASH_REMATCH[6]} ))
              if [ "$PRE" -lt 1 ]; then PRE=1; fi
              if [ "$PRE" -gt 998 ]; then PRE=998; fi
            else
              PRE=999
            fi
            VERSION_CODE=$(( BASE * 1000 + PRE ))
            if [ "$VERSION_CODE" -lt 1 ]; then
              VERSION_CODE="${{ github.run_number }}"
            fi
          else
            VERSION_CODE="${{ github.run_number }}"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$TAG_NAME versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured)
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::error::KEYSTORE_BASE64 secret is not set. The release build will refuse to sign with the debug key and fail. Add the signing keystore secrets before releasing."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Release Build
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintVitalRelease assembleRelease assembleDebug \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}" \
            --no-daemon

      - name: Package Release APKs & SHA-256 Checksums
        shell: bash
        run: |
          mkdir -p release-assets
          VERSION_TAG="${{ steps.meta.outputs.tag_name }}"

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$RELEASE_APK" "release-assets/OnyxTV-${VERSION_TAG}-release.apk"
          # Same file under a fixed name, so .../releases/latest/download/OnyxTV.apk is always the newest
          cp "$RELEASE_APK" "release-assets/OnyxTV.apk"
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release-assets/OnyxTV-${VERSION_TAG}-debug.apk"
          fi

          (
            cd release-assets
            sha256sum *.apk > "OnyxTV-${VERSION_TAG}-checksums.sha256"
          )
          ls -lh release-assets/

      - name: Cleanup Keystore
        if: always()
        run: rm -f release.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Onyx TV ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag_name, '-') }}
          files: |
            release-assets/*.apk
            release-assets/*.sha256
